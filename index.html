<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="style.css">
  <meta charset="UTF-8" />
  <title>PDF Link Tool</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 20px;
    }

    .box {
      border: 2px dashed #aaa;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 8px;
    }

    button {
      padding: 10px 18px;
      font-size: 16px;
      cursor: pointer;
    }

    #log {
      white-space: pre-wrap;
      background: #f5f5f5;
      padding: 16px;
      margin-top: 20px;
      border-radius: 6px;
      font-size: 14px;
    }
  </style>
</head>
<body>

<div class="container">

<h1>PDF Link Tool</h1>

<p class="subtitle">
Automatically add hyperlinks to your PDF using a simple CSV template.
Everything runs locally in your browser.
</p>

<div class="section">

<h2>PDF File</h2>

<input
type="file"
id="pdfFile"
accept="application/pdf">

</div>

<div class="section">

<h2>CSV File</h2>

<input
type="file"
id="csvFile"
accept=".csv">

</div>

<div class="buttons">

<button
class="secondary"
id="templateBtn">

Download CSV Template

</button>

<button
class="primary"
id="startBtn">

Generate PDF

</button>

</div>

<div id="log"></div>

<div class="footer">

Runs entirely in your browser.
Your files are never uploaded.

</div>

</div>

</body>
</html>
