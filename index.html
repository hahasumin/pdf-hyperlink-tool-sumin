<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>PDF Link Tool</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 20px;
    }

    .box {
      border: 2px dashed #aaa;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 8px;
    }

    button {
      padding: 10px 18px;
      font-size: 16px;
      cursor: pointer;
    }

    #log {
      white-space: pre-wrap;
      background: #f5f5f5;
      padding: 16px;
      margin-top: 20px;
      border-radius: 6px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <h1>PDF Link Tool</h1>

  <p>
    This tool runs in your browser. Files are not uploaded to a server.
  </p>

  <div class="box">
    <label>PDF file:</label><br />
    <input type="file" id="pdfFile" accept="application/pdf" />
  </div>

  <div class="box">
    <label>CSV file:</label><br />
    <input type="file" id="csvFile" accept=".csv" />
  </div>

  <button id="startBtn">Start</button>

  <div id="log"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
